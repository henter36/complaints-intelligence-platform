name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "file:./ci.db"
      NEXTAUTH_URL: "http://localhost:3000"
      NEXT_TELEMETRY_DISABLED: "1"
      # AI disabled in CI — no real key needed
      AI_ENABLED: "false"
      OPENAI_API_KEY: ""
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24"
          cache: npm

      - name: Generate ephemeral CI secrets
        shell: bash
        run: |
          echo "AUTH_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "INTERNAL_SCHEDULER_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Validate Prisma schema
        run: npm run db:validate

      - name: Generate Prisma client
        run: npm run db:generate

      - name: TypeScript
        run: npm run typecheck

      - name: ESLint
        run: npm run lint

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Generate release manifest
        run: npm run release:manifest

      - name: Release readiness check
        run: npm run release:check

      - name: Runtime high vulnerability audit
        run: npm run audit:runtime

      - name: Full high vulnerability audit
        # Dev tooling vulnerabilities (brace-expansion, minimatch, eslint-config-next, @vitest/coverage-v8)
        # have no available fix without major breaking upgrades. Runtime audit above is the hard gate.
        # Tracked for resolution when upstream packages publish fixes.
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Secret scan
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
