# Narrow, rule-specific exclusion. Do not add broad path/rule exclusions
# here without equally specific justification — this file must not become
# a general-purpose way to silence SonarCloud findings.
#
# plsql:S1192 ("Define a constant instead of duplicating this literal N
# times") fires on Prisma-generated SQLite migration SQL, where the
# duplicated literal is a plain column DEFAULT ('single-admin', used by
# ReportRun.requestedBy, ReportTemplate.createdBy, and the legacy-row
# backfill's COALESCE in migration.sql) — the same convention already used
# by every other model's createdBy column since Phase 2. SQL DDL has no
# constant/variable mechanism to deduplicate a DEFAULT literal, and these
# files are generated by `prisma migrate` and must not be hand-restructured
# after being committed/applied. Scoped to generated migration SQL only —
# no other SQL rule, and no other path, is exempted.
sonar.issue.ignore.multicriteria=e1

sonar.issue.ignore.multicriteria.e1.ruleKey=plsql:S1192
sonar.issue.ignore.multicriteria.e1.resourceKey=prisma/migrations/**/migration.sql
